name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Find and Unzip
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE"
        fi
        
        # gradlew ফাইলটি যেখানেই থাকুক খুঁজে বের করা
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project in $PROJECT_DIR"
          cd "$PROJECT_DIR"
        fi
        
        echo "CURRENT_DIR=$(pwd)" >> $GITHUB_ENV

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd ${{ env.CURRENT_DIR }}
        chmod +x gradlew || true

    - name: Build APK
      run: |
        cd ${{ env.CURRENT_DIR }}
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
